ocaliza causa."]], "f": "Lunge test, heel raise, Y-Balance, hop tests quando seguro, FAAM.", "s": "Suspeita de fratura, ruptura do Aquiles, trombose ou instabilidade importante: suspender carga provocativa e avaliar."}};let seg='Cervical',tab='MLA',state={};const tabs=['MLA','Testes ortopédicos','Avaliação','Registro','Referências'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function st(){return state[seg]??=( {m:{},l:{},a:{},tests:{},level:0,notes:'',pre:'',post:'',side:'Não definido',irr:'Moderada',task:'',nmes:false,alert:false,loads:{}})}function set(k,v){st()[k]=v}function selectSeg(n){seg=n;render();window.scrollTo(0,0)}function selectTab(n){tab=n;render()}function mark(g,i,v){st()[g][i]=v}function test(i,v){st().tests[i]=v}function render(){let d=D[seg],s=st();$('segments').innerHTML=Object.keys(D).map(n=>`<button class="${n===seg?'active':''}" onclick="selectSeg('${n}')">${n}</button>`).join('');$('region').textContent=seg;$('tabs').innerHTML=tabs.map(n=>`<button class="${n===tab?'active':''}" onclick="selectTab('${n}')">${n}</button>`).join('');let h='';if(tab==='MLA'){h=`<div class="card warning"><b>Segurança</b><p>${d.s}</p></div>`;for(let [g,title] of [['m','M — Mobilização'],['l','L — Liberação']])h+=`<div class="card"><h3>${title}</h3>${d[g].map((x,i)=>`<label class="line"><input type="checkbox" ${s[g][i]?'checked':''} onchange="mark('${g}',${i},this.checked)"> ${esc(x)}</label>`).join('')}<p class="muted">${g==='m'?'Maitland I–II para modulação; III–IV somente quando hipomobilidade e tolerância justificam. Referência: 2–3 × 30–60 s. MWM: 2–3 × 6–10 movimentos sem dor provocada.':'Miofascial: 45–90 s; alongamento: 2–3 × 20–30 s se indicado. Agulhamento opcional, individualizado, com consentimento e capacitação; não há dose universal.'}</p></div>`;h+=`<div class="card"><h3>A — Ativação e progressão</h3><label><input type="checkbox" ${s.nmes?'checked':''} onchange="set('nmes',this.checked)"> NMES, se indicada</label><p class="muted">NMES: referência 35–50 Hz, 200–400 µs, 5–10 s contração e 20–50 s repouso, 10–15 contrações efetivas. Ajustar ao equipamento, músculo, segurança e tolerância. TENS é analgesia.</p><label>Nível de exercício<select onchange="set('level',+this.value);render()">${['A1 Livre / controle motor','A2 Halteres, elásticos, caneleiras','A3 Máquinas e polias','A4 Integração funcional'].map((x,i)=>`<option value="${i}" ${s.level===i?'selected':''}>${x}</option>`).join('')}</select></label>${d.a.map((x,i)=>`<div class="line"><label><input type="checkbox" ${s.a[s.level+'-'+i]?'checked':''} onchange="mark('a','${s.level}-${i}',this.checked)"> <b>${x[0]}: ${x[s.level+1]}</b></label><details><summary>Ver todos os níveis</summary>${x.slice(1).map((v,j)=>`<p>A${j+1} — ${v}</p>`).join('')}</details><input type="text" placeholder="Séries × repetições / carga / RPE" value="${esc(s.loads[s.level+'-'+i])}" oninput="st().loads['${s.level}-${i}']=this.value"></div>`).join('')}<p class="muted">Inicial: 1–3 × 12–20, RPE 2–4; intermediário: 2–3 × 8–15, RPE 5–7; avançado: 3–4 × 6–12, RPE 7–9 conforme objetivo. Progredir uma variável segundo tolerância, resposta em 24 h e restrições.</p></div>`}else if(tab==='Testes ortopédicos'){h=`<div class="card warning">${d.s}<p>Testes isolados não confirmam diagnósticos. Selecionar conforme hipótese e segurança.</p></div><input id="search" type="text" placeholder="Buscar teste ou hipótese" oninput="filterTests(this.value)"><div id="testlist">${d.t.map((x,i)=>`<details data-search="${esc(x.join(' ').toLowerCase())}"><summary>${x[0]} <span class="muted">${s.tests[i]||''}</span></summary><p><b>Objetivo:</b> ${x[1]}</p><p><b>Execução:</b> ${x[2]}</p><p><b>Achado relevante:</b> ${x[3]}</p><label>Resultado<select onchange="test(${i},this.value);this.closest('details').querySelector('summary span').textContent=this.value">${['','Positivo','Negativo','Inconclusivo','Não realizado'].map(v=>`<option ${s.tests[i]===v?'selected':''}>${v}</option>`).join('')}</select></label></details>`).join('')}</div>`}else if(tab==='Avaliação'){h=`<div class="card warning">${d.s}<label><input type="checkbox" ${s.alert?'checked':''} onchange="set('alert',this.checked)"> Sinal de alerta ou restrição não esclarecida</label></div><div class="card"><h3>Exame de referência</h3><p>${d.f}</p><label>Lado<select onchange="set('side',this.value)">${['Não definido','Direito','Esquerdo','Bilateral','Central'].map(v=>`<option ${s.side===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Irritabilidade<select onchange="set('irr',this.value)">${['Alta','Moderada','Baixa'].map(v=>`<option ${s.irr===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Tarefa / teste funcional<input type="text" value="${esc(s.task)}" oninput="set('task',this.value)"></label><div class="row"><label>END antes (0–10)<input type="number" min="0" max="10" value="${esc(s.pre)}" oninput="set('pre',this.value)"></label><label>END depois (0–10)<input type="number" min="0" max="10" value="${esc(s.post)}" oninput="set('post',this.value)"></label></div><label>Observações / medidas<textarea oninput="set('notes',this.value)">${esc(s.notes)}</textarea></label></div>`}else if(tab==='Registro'){h=`<div class="card"><h3>Registro do atendimento</h3><pre style="white-space:pre-wrap;font:inherit" id="report">${esc(report())}</pre><button class="primary" onclick="copyReport()">Copiar registro</button><button class="primary" onclick="downloadReport()">Salvar registro TXT</button><button class="primary" onclick="window.print()">Imprimir / PDF</button><button class="primary" onclick="if(confirm('Limpar todos os registros desta sessão?')){state={};render()}">Novo atendimento</button><p id="msg" class="muted"></p><p class="muted">Registros ficam apenas na memória da página; exporte antes de fechar. Não inclua dados identificáveis desnecessários.</p></div>`}else{h=`<div class="card"><h3>Referências e limites</h3><p>Estrutura MLA baseada no material fornecido: PAC, PAU, MWM, mobilizações gerais, liberação miofascial, agulhamento, alongamentos, eletroterapia e mecanoterapia. Seleção dos testes e exercícios é complementar; não representa protocolo validado.</p><p><a href="https://now.aapmr.org/specialized-musculoskeletal-examination/">AAPM&R — Specialized Musculoskeletal Examination</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/41680685/">Revisão de testes para radiculopatia cervical</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/17720798/">Revisão de testes de ombro</a></p><p><a href="https://doi.org/10.2519/jospt.2021.0304">Diretriz de lombalgia, JOSPT 2021</a></p><p><a href="https://doi.org/10.2519/JOSPT.2021.0302">Diretriz de entorse lateral, JOSPT 2021</a></p><p>Não foram validadas individualmente todas as descrições e dosagens. Não há inventário confirmado das máquinas da unidade. Não aplicar três técnicas passivas indiscriminadamente. A progressão depende da condição, não apenas do nível.</p></div>`}$('view').innerHTML=h}function filterTests(v){document.querySelectorAll('[data-search]').forEach(e=>e.hidden=!e.dataset.search.includes(v.toLowerCase()))}function report(){let out=['REGISTRO MLA — '+new Date().toLocaleDateString('pt-BR')];for(let [n,s] of Object.entries(state)){let d=D[n];out.push('\n'+n+' | '+s.side+' | Irritabilidade: '+s.irr,'Triagem: '+(s.alert?'restrição/sinal de alerta — reavaliar':'não sinalizado (não equivale a triagem negativa)'),'Teste funcional: '+s.task,'END pré/pós: '+s.pre+' / '+s.post,'M: '+d.m.filter((_,i)=>s.m[i]).join('; '),'L: '+d.l.filter((_,i)=>s.l[i]).join('; '),'NMES: '+(s.nmes?'Sim':'Não'));for(let [k,v] of Object.entries(s.a)){if(v){let [j,i]=k.split('-').map(Number);out.push('A'+(j+1)+': '+d.a[i][j+1]+' | '+(s.loads[k]||'dose não informada'))}}for(let [i,v] of Object.entries(s.tests))if(v)out.push(d.t[i][0]+': '+v);out.push('Observações: '+s.notes)}return out.join('\n')}async function copyReport(){try{await navigator.clipboard.writeText(report());$('msg').textContent='Registro copiado.'}catch(e){$('msg').textContent='Selecione o texto do registro e copie manualmente.'}}function downloadReport(){let u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='registro-mla.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();</script></body></html>
